# Derived from cubiq/Mellon@5fd242921d13bff9fb03f4de405fdd39c2335e1f; modified by MoDiff.
[project]
name = "modiff"
version = "0.1.0"
description = "MoDiff is a modular Diffusers client/server application."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=1.4.0",
  "aiohttp>=3.11.12",
  "aiohttp-cors>=0.7.0",
  "kornia>=0.8.1",
  "nanoid>=2.0.0",
  "peft>=0.21.2",
  "protobuf>=6.31.1",
  "scipy>=1.15.2",
  "sentencepiece>=0.2.0",
  "torch>=2.6.0; sys_platform != 'darwin'",
  # The latest published CPython 3.12 macOS ARM wheels are Torch 2.11 /
  # TorchVision 0.26. Universal locks otherwise select newer Linux-only builds.
  "torch>=2.6.0,<2.12; sys_platform == 'darwin'",
  "torchsde>=0.2.6",
  "torchvision>=0.21.0; sys_platform != 'darwin'",
  "torchvision>=0.21.0,<0.27; sys_platform == 'darwin'",
  "transformers>=5.18.0",
  "diffusers>=0.41.0",
  "ftfy>=6.3.1",
  "huggingface-hub>=1.31.0,<2.0",
  "imageio>=2.37.2",
  "imageio-ffmpeg>=0.6.0",
  "spandrel>=0.4.2",
  "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
cpu = ["torch>=2.6.0", "torchvision>=0.21.0"]
apple-silicon = [
  "torch>=2.6.0; sys_platform == 'darwin'",
  "torchvision>=0.21.0; sys_platform == 'darwin'",
]
cuda = [
  "torch>=2.6.0; sys_platform == 'linux' or sys_platform == 'win32'",
  "torchvision>=0.21.0; sys_platform == 'linux' or sys_platform == 'win32'",
]
xpu = [
  "torch>=2.12.1; sys_platform == 'linux' or sys_platform == 'win32'",
  "torchvision>=0.27.1; sys_platform == 'linux' or sys_platform == 'win32'",
  "triton-xpu; sys_platform == 'linux'",
]
spandrel = ["spandrel"]
gallery-media = ["opencv-python-headless>=4.11.0"]
cosmos-safety = ["cosmos-guardrail==0.3.1", "opencv-python==5.0.0.93"]
quantization = [
  "dfloat11[cuda12]; sys_platform == 'linux' or sys_platform == 'win32'",
  "gguf",
  "kernels==0.16.0",
  "optimum-quanto==0.2.7",
  "torchao==0.17.0",
]


[tool.ruff]
line-length = 119

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

[tool.setuptools.packages.find]
# MoDiff intentionally keeps both the server package and its built-in node
# modules at the repository root. Explicit discovery prevents editable
# installs from treating runtime data/web/custom directories as packages.
include = ["modiff*", "modules*"]
exclude = ["custom*", "data*", "tests*", "web*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
conflicts = [
  [{ extra = "cpu" }, { extra = "cuda" }, { extra = "xpu" }],
  # The packages share the cv2 namespace. Use one provider in a clean owned
  # environment; runtime activation also checks distribution ownership.
  [{ extra = "gallery-media" }, { extra = "cosmos-safety" }],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
triton-xpu = { index = "pytorch-xpu", extra = "xpu" }
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu128", extra = "cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-xpu", extra = "xpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
