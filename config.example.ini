# Derived from cubiq/Mellon@5fd242921d13bff9fb03f4de405fdd39c2335e1f; modified by MoDiff.
[server]
# MoDiff has no authentication or multi-user security boundary. Keep the
# server on loopback unless you have added an authenticated, access-controlled
# deployment layer and understand the file/code-execution risks.
host = 127.0.0.1
port = 8088

# CORS is disabled by default. Enabling it does not add authentication.
# cors = false
# cors_routes = http://127.0.0.1:5173

# Optional TLS. Relative certificate paths are resolved from the app root.
# secure = false
# ssl_cert = certs/server.crt
# ssl_key = certs/server.key

# Maximum request body size in bytes. The application fallback is 1 GiB.
# Lower it further unless large local image/video uploads need it.
# client_max_size = 1073741824

[logging]
# DEBUG | INFO | WARNING | ERROR | CRITICAL
level = INFO

[huggingface]
# Optional Hugging Face access token for gated/private repositories.
# This value is plaintext in config.ini. Use a least-privilege read token,
# keep config.ini untracked, and rotate the token if the file is exposed.
# token =

# Leave blank to use the normal Hugging Face cache resolution. When set,
# MoDiff also exports this value as HF_HUB_CACHE for the backend process.
# cache_dir =

# Auto | Online | Offline
# Auto uses local files when available and otherwise allows online resolution.
online_status = Auto

[paths]
# The file browser and relative workflow paths are scoped to work_dir.
# Use "~" for the current user's home directory, or leave blank to use the
# repository's data directory. Do not point this at a broad or sensitive tree.
# work_dir =

# Runtime metadata, Studio history, blocks, shares, and related files.
# Relative paths below are resolved under work_dir.
# data =

# Generated media and local model locations.
# images = images
# videos = videos
# audio = audio
# models = models
# upscalers = models/upscalers

# Temporary/offload-capable working storage. The process needs write access.
# temp = temp

[environ]
# Entries in this section are exported before the model registry is imported.
# Examples:
# HF_HUB_DISABLE_SYMLINKS_WARNING = 1
# CC = /usr/bin/gcc-13
# CXX = /usr/bin/g++-13
# TORCH_CUDA_ARCH_LIST = 8.6+PTX
