name: Qualify native base runtime on macOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-runtime-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-macos-arm64:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Verify hosted target
        run: test "$(uname -m)" = "arm64"
      - name: Install native base
        run: uv sync --locked
      - name: Verify required libraries and LoRA without model downloads
        run: ./.venv/bin/python scripts/smoke_base_runtime.py | tee "$RUNNER_TEMP/native-runtime-macos-arm64.json"
      - name: Upload review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-runtime-macos-arm64-${{ github.run_id }}
          path: ${{ runner.temp }}/native-runtime-macos-arm64.json
          if-no-files-found: warn
          retention-days: 14
