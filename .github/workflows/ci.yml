name: CI
on: [push, pull_request]
jobs:
  backend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: python -m unittest tests.test_accelerator_manifest tests.test_install_detection tests.test_install_guidance tests.test_hardware
      - run: python -m modiff.install --accelerator cpu --dry-run --json
